# ---------------------------------------------------------------------------
# Context configuration (ContextConfigOCD) - one entry per key in ConfigConstants.
# Generated alongside ContextConfigOCD; keep the two in step.
# ---------------------------------------------------------------------------

# --- Native evaluation ---

enableNativeFilter.name=Native Filter
enableNativeFilter.description=Whether Filter() may be evaluated in SQL. Default true. It is read twice: once when the catalog is built, to enable the native Filter handler, and again per query, where it also decides whether a Filter() nested inside a CrossJoin or TopCount argument is recognised. Turning it off after the catalog is loaded therefore only affects the second.

enableNativeCrossJoin.name=Native CrossJoin
enableNativeCrossJoin.description=Whether CrossJoin and NonEmptyCrossJoin may be evaluated in SQL. Default true. This is where native evaluation matters most: in memory the full product is built and then filtered, in SQL only the non-empty combinations are ever produced. Read when the catalog is built, so a later change takes effect only after a rebuild.

enableNativeNonEmpty.name=Native NON EMPTY
enableNativeNonEmpty.description=Whether NON EMPTY member sets - member.children, level.members, descendants - may be constrained in SQL. Default true. Beware the interaction: the evaluator derives whether native evaluation is possible at all as enableNativeNonEmpty OR enableNativeCrossJoin, so switching both off disables every native path including TopCount and Filter, whatever their own switches say.

enableNativeTopCount.name=Native TopCount
enableNativeTopCount.description=Whether TopCount may be evaluated in SQL. Default true. TopCount only - BottomCount never goes native, whatever this is set to. Read when the catalog is built.

expandNonNative.name=Expand Non-Native Sub-Expressions
expandNonNative.description=Whether non-native sub-expressions are expanded into member lists so that the surrounding expression can still go native. Default false. Not a hard gate: cheap sets - LastChild, FirstChild, Lag - are expanded either way. The expanded list is subject to resultLimit.

nativizeMinThreshold.name=NativizeSet Minimum Threshold
nativizeMinThreshold.description=Expected cardinality from which NativizeSet evaluates natively. Default 100000. Below it the fixed cost of the native path does not pay off. Two places compare against this number with different estimates and different operators, so a value close to a set's actual size can give inconsistent decisions; change it by an order of magnitude, not by a little.

nativizeMaxResults.name=NativizeSet Maximum Result Size
nativizeMaxResults.description=Largest result NativizeSet will produce; 0 or less means unlimited. Default 150000. Exceeding it raises a resource-limit error rather than materialising the result. Applies to NativizeSet alone - the general cap is resultLimit.

alertNativeEvaluationUnsupported.name=Alert When Native Evaluation Is Unsupported
alertNativeEvaluationUnsupported.description=What to report when a function that could have gone native has to fall back. Default OFF. WARN logs it, ERROR raises NativeEvaluationUnsupportedException. Only NonEmptyCrossJoin and TopCount report at all - a plain CrossJoin, Filter and native NON EMPTY never do - so a quiet log is not evidence that every query went native.
alertNativeEvaluationUnsupported.option.OFF.label=Off - say nothing
alertNativeEvaluationUnsupported.option.WARN.label=Warn - log it
alertNativeEvaluationUnsupported.option.ERROR.label=Error - fail the query

levelPreCacheThreshold.name=Level Pre-Cache Threshold
levelPreCacheThreshold.description=Level cardinality below which requesting some members of a level loads all of them. Default 300; 0 or less switches precaching off. Asking for two children of [Store].[USA] then costs one round trip instead of one per member. The comparison is strict, so a level with exactly this many members is not precached.

# --- Cell cache and segments ---

segmentCache.name=External Segment Cache Class
segmentCache.description=Class name of an external segment cache, instantiated by name through the thread context class loader using its no-argument constructor. Empty for none, which is the default. An external cache lets several server instances share loaded segments. Implementations found through the service loader are used in addition to this one, so a cache can be active with this unset.

disableCaching.name=Disable Cell Cache
disableCaching.description=Whether cell caching is bypassed. Default false. Nothing is cleared - segments are simply not indexed, not stored and not rolled up, and the member cache and the cached native tuple results are switched off as well. Reads from a configured external segment cache still happen. Useful for measuring a query from cold, almost never in production.

disableLocalSegmentCache.name=Disable Local Segment Cache
disableLocalSegmentCache.description=Whether the in-process segment cache is used. Default false, that is, it is used. Its entire effect is that no in-memory cache worker is created; the segment index, the member cache and any external cache are untouched. Only sensible together with an external segmentCache.

enableSessionCaching.name=Session-Scoped Cell Cache
enableSessionCaching.description=Whether each connection gets its own segment cache manager instead of sharing the context's. Default false. It isolates one user's cached cells from another's at the cost of loading the same data repeatedly, and every manager brings its own threads. The per-connection managers are released when the connection closes and at XMLA transaction boundaries. Connections with pending writeback changes are isolated regardless of this setting.

cellBatchSize.name=Cell Batch Size
cellBatchSize.description=How many cell requests are collected before the cache manager is asked for them. Default -1, which - like 0 and any negative value - means 100000. Despite the name this is not an upper bound: every n-th request triggers a round to the cache manager and collection then continues, so the query still completes.

sparseSegmentCountThreshold.name=Sparse Segment Count Threshold
sparseSegmentCountThreshold.description=Count component of the sparse-versus-dense decision for stored cell values. Default 1000. A segment is stored sparsely when (possible - countThreshold) * densityThreshold > actual. With the defaults, 1000 possible cells with none filled, 2000 with 500 and 3000 with 1000 are all still dense. A negative value is read as 0.

sparseSegmentDensityThreshold.name=Sparse Segment Density Threshold
sparseSegmentDensityThreshold.description=Density component of the sparse-versus-dense decision; see the count threshold for the formula both values feed. Default 0.5, clamped to the range 0 to 1. At 0 segments are always stored densely.

enableInMemoryRollup.name=In-Memory Rollup
enableInMemoryRollup.description=Whether a coarser segment may be rolled up from finer segments already in memory instead of querying the database again. Default true. Not sufficient on its own: the measure's aggregator has to support fast aggregation, which rules out distinct counts.

# --- Evaluation and MDX semantics ---

solveOrderMode.name=Solve Order Mode
solveOrderMode.description=How the solve order of calculated members and sets is compared. Default ABSOLUTE - solve orders are compared across the whole query, so a query-defined member with solve order 1 outranks a cube-defined member with 2. SCOPED resolves cube before session before query calculations and compares only within one scope. An unrecognised value falls back to ABSOLUTE without complaint.
solveOrderMode.option.ABSOLUTE.label=Absolute - compare solve orders across the whole query
solveOrderMode.option.SCOPED.label=Scoped - compare solve orders only within the defining scope

compoundSlicerMemberSolveOrder.name=Compound Slicer Member Solve Order
compoundSlicerMemberSolveOrder.description=Solve order given to the implicit calculated member that a compound slicer creates. Default -99999, low enough that ordinary calculated members are evaluated first. Only a compound slicer creates such a member; with a simple slicer this is never read.

currentMemberWithCompoundSlicerAlert.name=Alert On CurrentMember With A Compound Slicer
currentMemberWithCompoundSlicerAlert.description=What to do when CurrentMember is used on a hierarchy that a compound slicer constrains with more than one member. Default ERROR. That combination has no well-defined answer: the slicer puts a set on the hierarchy, so there is no single current member. WARN logs it, OFF says nothing.
currentMemberWithCompoundSlicerAlert.option.OFF.label=Off - say nothing
currentMemberWithCompoundSlicerAlert.option.WARN.label=Warn - log it
currentMemberWithCompoundSlicerAlert.option.ERROR.label=Error - fail the query

ignoreMeasureForNonJoiningDimension.name=Ignore Measures For Non-Joining Dimensions
ignoreMeasureForNonJoiningDimension.description=Whether a measure is dropped from an aggregation when the tuple contains a dimension the measure does not join to. Default false, and this one changes reported totals. Gender does not join to [Warehouse Sales]: with false the warehouse figure at the Gender All level still contributes and a report of M, F and All does not add up; with true the unrelated measure is left out. Only consulted where the cube usage sets IgnoreUnrelatedDimensions to false.

nullDenominatorProducesNull.name=Null Denominator Produces Null
nullDenominatorProducesNull.description=How division handles nulls. Default false, matching SSAS: a null numerator gives null, and a non-null numerator over a null denominator gives Infinity. With true both cases give null. A zero denominator is not covered either way. The value is fixed into the expression when it is compiled, so a change does not reach statements already prepared.

needDimensionPrefix.name=Require Dimension Prefix
needDimensionPrefix.description=Intended to require that MDX identifiers be prefixed with their dimension, so that [Gender].[M] resolves but [M] does not - failing fast instead of walking every dimension, hierarchy and level of a large schema. NOT IMPLEMENTED: no code reads this key, so setting it has no effect.

ignoreInvalidMembers.name=Ignore Invalid Members While Loading
ignoreInvalidMembers.description=Whether a member named in the schema but missing from the database is treated as the null member while the catalog is loaded. Default false, that is, loading fails. It reaches into access control as well: with true, a member grant pointing at a member that does not exist is silently dropped instead of failing. During a query ignoreInvalidMembersDuringQuery applies instead; the two never both matter for one lookup.

ignoreInvalidMembersDuringQuery.name=Ignore Invalid Members During A Query
ignoreInvalidMembersDuringQuery.description=Whether a member named in a query but missing from the database is treated as the null member. Default false, that is, the query fails. Applies whenever the catalog is not being loaded; while it is, ignoreInvalidMembers applies.

maxEvalDepth.name=Maximum Evaluation Depth
maxEvalDepth.description=How many passes over the query are allowed before evaluation is given up. Default 10. A pass ends when the batched cell reader has loaded what was missing; a deeply chained calculated member needs several. Exceeding the limit is reported as an internal error suspecting a cycle, not as a resource limit.

iterationLimit.name=Iteration Limit
iterationLimit.description=Maximum number of iterations while aggregating over members; 0 or less means no limit, and 0 is the default. Careful: the same number is also used as the recursion depth at which a named set that references itself is reported - an unrelated meaning that happens to share the key.

crossJoinOptimizerSize.name=CrossJoin Optimizer Size
crossJoinOptimizerSize.description=List size from which the crossjoin optimizer is applied. Default 0, so it applies to every list - but only in a NON EMPTY context; outside one the optimizer never runs, whatever the value. Setting it above any realistic list size switches it off.

optimizePredicates.name=Optimize Predicates
optimizePredicates.description=Whether a column constraint may be dropped so that the segment loaded also answers the next, slightly different question. Default true. Constraints are ranked by how much dropping them would widen the result and dropped until the widening falls to a factor of two. A constraint whose value list exceeded maxConstraints is dropped even with this off, so the two settings interact.

# --- Aggregate tables ---

useAggregates.name=Use Aggregate Tables
useAggregates.description=Whether aggregate tables are looked for and used. Default false. This is the master switch: with it off the catalog is never scanned, so there is no aggregate table to choose. The scan happens once when the catalog is built - switching this on later cannot make aggregate tables appear - while the decision to use one is taken afresh for each query.

readAggregates.name=Read Aggregate Tables
readAggregates.description=Whether aggregate tables are also recognised by name pattern, in addition to those declared explicitly in the schema. Default false. It has no effect of its own: useAggregates has to be on for the database to be scanned at all.

chooseAggregateByVolume.name=Choose Aggregate Table By Volume
chooseAggregateByVolume.description=How the cheapest aggregate table is picked. Default false, that is, by row count. True ranks by volume - rows times columns - which is closer to the amount of data read. Not only a tiebreak: an aggregate table whose chosen metric is zero is discarded, so switching this can change which aggregate tables exist at all.

generateAggregateSql.name=Log Aggregate Table DDL And DML
generateAggregateSql.description=Whether the DDL and DML for candidate aggregate tables is written to the log while aggregate requests are processed. Default false. A tool for authoring aggregate tables, not something to leave on - and the generated statements go out at debug level, so the logger has to be set accordingly or nothing appears.

enableGroupingSets.name=Use SQL GROUPING SETS
enableGroupingSets.description=Whether rollups are expressed with the SQL GROUPING SETS construct, so that one statement replaces several. Default false. Also requires the dialect to report support; where it does not, the setting is ignored.

enableTotalCount.name=Total Row Count In Drill-Through
enableTotalCount.description=Whether an XML/A drill-through response carries the total row count of the underlying query. Default false, because the count costs a second query. Applies to XML/A drill-through only, not to drill-through through the OLAP API.

# --- Concurrency ---

queryLimit.name=Concurrent Query Limit
queryLimit.description=How many SQL statements this context may have running at once. Default 40. A statement that finds no slot waits rather than failing. The limit protects the database rather than this process: throughput usually falls well before a database's own connection limit is reached.

rolapConnectionShepherdNbThreads.name=Shepherd Thread Count
rolapConnectionShepherdNbThreads.description=Number of threads watching running queries for cancellation. Default 20. It sets a degree of parallelism, not a cap: the work queue behind the pool is unbounded, so no request is ever refused.

rolapConnectionShepherdThreadPollingInterval.name=Shepherd Polling Interval
rolapConnectionShepherdThreadPollingInterval.description=How often the shepherd threads look at running queries, in the unit below. Default 1000 milliseconds. This is the granularity with which a cancelled or timed-out query is noticed from outside; set above queryTimeout it delays that notice, though the evaluator's own checks still stop the query.

rolapConnectionShepherdThreadPollingIntervalUnit.name=Shepherd Polling Interval Unit
rolapConnectionShepherdThreadPollingIntervalUnit.description=Unit of the shepherd polling interval. Default MILLISECONDS.
rolapConnectionShepherdThreadPollingIntervalUnit.option.NANOSECONDS.label=Nanoseconds
rolapConnectionShepherdThreadPollingIntervalUnit.option.MICROSECONDS.label=Microseconds
rolapConnectionShepherdThreadPollingIntervalUnit.option.MILLISECONDS.label=Milliseconds
rolapConnectionShepherdThreadPollingIntervalUnit.option.SECONDS.label=Seconds
rolapConnectionShepherdThreadPollingIntervalUnit.option.MINUTES.label=Minutes
rolapConnectionShepherdThreadPollingIntervalUnit.option.HOURS.label=Hours
rolapConnectionShepherdThreadPollingIntervalUnit.option.DAYS.label=Days

segmentCacheManagerNumberSqlThreads.name=Segment SQL Thread Count
segmentCacheManagerNumberSqlThreads.description=Number of threads running SQL to populate segments. Default 100; 0 or less means unbounded. A degree of parallelism, not a cap - the queue behind the pool is unbounded, so no request is refused. What limits statements in flight is queryLimit.

segmentCacheManagerNumberCacheThreads.name=Segment Cache Thread Count
segmentCacheManagerNumberCacheThreads.description=Number of threads talking to the external segment cache. Default 100; 0 or less means unbounded. Only relevant with an external segmentCache configured.

# --- Execution, cancellation and limits ---

queryTimeout.name=Query Timeout (Seconds)
queryTimeout.description=Limit in seconds on how long one statement may run; 0 means no limit. Default 60. The budget becomes an absolute deadline when the statement starts; the evaluator checks it every checkCancelOrTimeoutInterval iterations and the shepherd threads poll it, so a query that overruns fails with a timeout rather than running on.

executeDuration.name=Execution Budget
executeDuration.description=Budget for one execution in the unit below; 0 means no limit, which is the default. Unlike queryTimeout it covers the whole execution including the work after the last statement returns. Enforced the same way, at the same check points.

executeDurationUnit.name=Execution Budget Unit
executeDurationUnit.description=Unit of the execution budget. Default MILLISECONDS. Every TimeUnit is honoured; an earlier form understood only milliseconds and seconds and quietly read anything else as milliseconds.
executeDurationUnit.option.NANOSECONDS.label=Nanoseconds
executeDurationUnit.option.MICROSECONDS.label=Microseconds
executeDurationUnit.option.MILLISECONDS.label=Milliseconds
executeDurationUnit.option.SECONDS.label=Seconds
executeDurationUnit.option.MINUTES.label=Minutes
executeDurationUnit.option.HOURS.label=Hours
executeDurationUnit.option.DAYS.label=Days

checkCancelOrTimeoutInterval.name=Cancellation Check Interval
checkCancelOrTimeoutInterval.description=How many loop iterations pass between checks whether the query has been cancelled. Default 1000; 0 or less switches the check off entirely rather than checking every iteration. Too small costs measurable time on large result sets, too large leaves a cancelled query holding its resources after the user gave up.

enableDrillThrough.name=Allow Drill-Through
enableDrillThrough.description=Whether drill-through is permitted. Default true. With false any attempt is refused and cells report that they cannot be drilled through - a way to keep row-level data out of reach where only aggregates should be visible.

# --- Memory monitor ---

memoryMonitor.name=Memory Monitor
memoryMonitor.description=Whether each execution installs a heap monitor that aborts the query instead of letting it exhaust memory. Default false. It does not govern all memory-driven behaviour: caches are shed under memory pressure by a separate monitor that ignores this setting.

memoryMonitorThreshold.name=Memory Monitor Threshold (Percent)
memoryMonitorThreshold.description=Heap usage percentage above which the memory monitor aborts the query. Default 90. Measured after garbage collection, so it reflects live data rather than garbage awaiting collection. Only consulted while memoryMonitor is on.

# --- SQL and diagnostics ---

generateFormattedSql.name=Format Generated SQL
generateFormattedSql.description=Whether generated SQL is rendered over several lines instead of compactly. Default false. Layout only - no clause, join or predicate changes - so it is safe to turn on while reading query logs, at the cost of larger logs.

warnIfNoPatternForDialect.name=Warn About Missing SQL Expectations
warnIfNoPatternForDialect.description=Whether a comparison test without an expected SQL statement for the current dialect is reported. Default NONE, that is, silence; ANY warns for every dialect and a dialect name warns only for that one. Such a test is skipped either way, which is why the warning exists - a skipped test looks exactly like a passing one. Read only by the legacy test harness; it has no effect on a running server.

testExpDependencies.name=Expression Dependency Testing
testExpDependencies.description=How hard to check that expressions really are independent of the dimensions they claim not to depend on. Default 0, off. A positive value makes the evaluator compute each expression several times in varying contexts and compare, and the number itself seeds those variations. A diagnostic for developing operators, far too slow otherwise; a configured profiler takes precedence over it.

# --- Naming, ordering and result shape ---

caseSensitive.name=Case-Sensitive Identifiers
caseSensitive.description=Whether names are matched case-sensitively. Default false, so [gender].[f] finds [Gender].[F]. It reaches further than identifier lookup: cube lookup, the Properties() function and cell property lookup use it too, and with false a member looked up by name gets a case-folding wrapper in the generated SQL, which can keep an index from being used.

caseSensitiveMdxInstr.name=Case-Sensitive InStr
caseSensitiveMdxInstr.description=Whether the InStr and InStrRev functions match case-sensitively. Default false. It affects those two functions and nothing else - not InStrB, not Like, not the comparison operators - and is independent of caseSensitive, which governs name lookup.

compareSiblingsByOrderKey.name=Compare Siblings By Order Key
compareSiblingsByOrderKey.description=Whether sibling members are compared by the value of their ordinal expression rather than by the order the database returned them in. Default false, that is, the SQL ORDER BY decides. It also determines whether order keys are read from the database at all, so it has to be set before members are loaded to take effect.

enableExpCache.name=Expression Cache
enableExpCache.description=Whether the set argument of the Aggregate family and the two-argument form of Rank are cached across evaluations. Default true. Without it, Rank([Product].CurrentMember, Order([Product].MEMBERS, [Measures].[Unit Sales])) sorts the whole product dimension again for every single member. Narrower than a general expression cache: the Cache() function and the three-argument Rank are unaffected, and the decision is taken when the statement is compiled.

enableNonEmptyOnAllAxis.name=NON EMPTY On All Axes
enableNonEmptyOnAllAxis.description=Whether every query axis is implicitly NON EMPTY. Default false. With true, members with no data disappear from every axis without the query saying so; the slicer is not affected. It can only add NON EMPTY, never remove it from an axis that asked for it.

enableRolapCubeMemberCache.name=Cube Member Cache
enableRolapCubeMemberCache.description=Whether cube-specific views of shared members are cached. Default true. It has to be false for the member-level operations of CacheControl, which refuse to run while the cache is on because they could not keep it consistent. The value is captured when a hierarchy is built, so a change takes effect only after the catalog is rebuilt.

filterChildlessSnowflakeMembers.name=Filter Childless Snowflake Members
filterChildlessSnowflakeMembers.description=Whether snowflake dimensions are joined so that members without children are filtered out. Default true. With false those queries are cheaper, but a row in an outer snowflake table that no inner row references shows up as a member with no children - and aggregate segment queries fall back to the older SQL generator. The better fix is to remove such rows during ETL and only then set this to false.

maxConstraints.name=Maximum IN List Size
maxConstraints.description=Largest number of values placed in a generated SQL IN list. Default 1000, which is a property of the database: Oracle refuses more than 1000 expressions in a list, DB2 manages about 2500, most others 10000 and more. Above the limit the reaction differs by site - aggregating over a longer list raises an error, a native evaluation declines, and a cell request silently drops the constraint and reads more rows than were asked for.

nullMemberRepresentation.name=Null Member Representation
nullMemberRepresentation.description=How a null member appears in results. Default #null; Analysis Services 2000 showed an empty string and 2005 showed (null), so pick whichever a client expects. Not display-only: the same text is compared, ignoring case, against column values to recognise a null member on the way in. Set to something that occurs in the data, it makes those rows generate IS NULL predicates.

memberListCacheMaxWeight.name=Member List Cache Max Weight
memberListCacheMaxWeight.description=Weight cap for each hierarchy's member-list caches (children lists and level-member lists; an entry weighs its member count, the named-children store counts entries). Least-recently-used lists are evicted beyond it. Default 200000 per cache per hierarchy. The member-key cache that guarantees one object per member stays softly referenced and is not governed by this.
nativeTupleCacheMaxTuples.name=Native Tuple Cache Max Tuples
nativeTupleCacheMaxTuples.description=Weight cap for each catalog's cached native set results: the sum over all cached tuple lists of tuples times arity. Least-recently-used results are evicted beyond it. Default 1000000. The cache is bounded and strongly referenced - it shrinks by this cap, not with memory pressure.
resultLimit.name=Result Limit
resultLimit.description=Largest permitted intermediate result; 0 or less means no limit, which is the default. A brake against a single query exhausting the heap, not a correctness setting - a query that trips it fails rather than returning less. One number bounds several different things in different units: crossjoin tuples, the capacity of a tuple list, rows read from SQL for members and for segments, and the product of the member counts of all axes.
